<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linden · drawings</title>
<style>
  body{margin:0;padding:16px;font:14px/1.4 system-ui}
  h2{font:600 13px system-ui;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px;color:var(--muted)}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;justify-items:center;gap:4px}
  .cell span{font-size:11px;color:var(--muted)}
  .cell svg{display:block}
  .night-bg{background:var(--sky)}
  .big svg{width:360px;height:250px}
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import '../src/styles/tokens.css';
import '../src/styles/base.css';
import '../src/styles/street.css';
import { stranger, strangerSVG, lanternSVG, sparkSVG, mossSVG } from '../src/art/stranger.js';
import { cat, blanket } from '../src/art/people.js';
import { garden, busstop, no9, roof, panelSVG, NO9 } from '../src/art/night.js';
import { sceneSVG } from '../src/art/scenes.js';

const theme = new URLSearchParams(location.search).get('theme');
if (theme) document.documentElement.dataset.theme = theme;
const cell = (svg, label, cls = '') => `<div class="cell ${cls}">${svg}<span>${label}</span></div>`;
const moods = ['calm', 'happy', 'surprised', 'thinking', 'shy', 'sleep', 'star'];
const scene = (inner, night) => `<div class="cell big ${night ? 'night' : ''}"><svg viewBox="0 0 360 250">${inner}</svg></div>`;
const spots = new URLSearchParams(location.search).has('spots');
document.getElementById('out').innerHTML = `
  <h2>The Stranger</h2>
  <div class="row">${moods.map(m => cell(`<svg viewBox="0 0 120 160" width="120" height="160">${stranger(m, { light: .5 })}</svg>`, m)).join('')}</div>
  <div class="row night" style="margin-top:10px;background:var(--sky);padding:10px;border-radius:12px">${moods.map(m => cell(`<svg viewBox="0 0 120 160" width="120" height="160">${stranger(m, { light: m === 'star' ? 1 : .15 + moods.indexOf(m) * .14 })}</svg>`, m, 'night-bg')).join('')}</div>
  <h2>Faces, lantern, spark, Mr Moss</h2>
  <div class="row">${['calm', 'happy', 'surprised'].map(m => cell(`<span style="width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--night);display:block">${strangerSVG(m, { crop: 'face' })}</span>`, m)).join('')}
    ${[0, 3, 7, 12].map(n => cell(`<span style="width:70px;display:block">${lanternSVG(n)}</span>`, n + ' sparks')).join('')}
    ${cell(`<span style="width:40px;display:block">${sparkSVG()}</span>`, 'spark')}
    ${cell(`<span style="width:120px;display:block">${mossSVG()}</span>`, 'Mr Moss')}${cell(`<span style="width:120px;display:block">${mossSVG({ awake: true })}</span>`, 'awake')}</div>
  <h2>Mimi</h2>
  <div class="row">${cell(`<svg viewBox="0 0 80 60" width="240" height="180">${cat()}</svg>`, 'awake')}${cell(`<svg viewBox="0 0 80 60" width="240" height="180">${cat({ sleep: true })}</svg>`, 'asleep')}
    ${cell(`<svg viewBox="0 0 120 70" width="240" height="140">${blanket(6, 6, 108, 48)}<g transform="translate(20 -2)">${cat({ sleep: true })}</g></svg>`, 'on the blanket')}</div>
  <h2>Scenes</h2>
  <div class="row">${scene(garden(), true)}${scene(busstop({ lights: 2 }), true)}${scene(no9() + (spots ? Object.entries(NO9).map(([k, [x, y, w, h]]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(255,0,0,.25)" stroke="red"/><text x="${x}" y="${y - 2}" font-size="7" fill="red">${k}</text>`).join('') : ''))}${scene(roof(), true)}
    <div class="cell big night">${sceneSVG('room')}</div><div class="cell big">${sceneSVG('room')}</div></div>
  <h2>Album</h2>
  <div class="row">${Array.from({ length: 12 }, (_, k) => `<div class="cell big ${[1, 3, 4, 7, 9, 10, 11, 12].includes(k + 1) ? 'night' : ''}">${panelSVG(k + 1)}<span>${k + 1}</span></div>`).join('')}</div>`;
</script>
</body>
</html>
